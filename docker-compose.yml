services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: holocron
      POSTGRES_PASSWORD: holocron
      POSTGRES_DB: holocron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the tests' own database the first time the volume is made.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "holocron"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      PROCESS_ROLE: api
      DATABASE_URL: postgres://holocron:holocron@postgres:5432/holocron
      PORT: 3000
      COOKIE_SECRET: dev-secret-change-me
      ACCESS_CODE: ${ACCESS_CODE:-}
    # Published so the Vite dev server on 5173 can proxy /api to it, which is
    # how the web app is worked on without rebuilding the image each time.
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data:/data
      - ./samples:/app/samples:ro

  worker:
    build:
      context: .
      target: api
    command: ["node", "dist/worker.js"]
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: postgres://holocron:holocron@postgres:5432/holocron
      # Only the worker calls the model, so only the worker gets the key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      SPLIT_MODEL: ${SPLIT_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data:/data
      - ./samples:/app/samples:ro
    stop_grace_period: 60s

  caddy:
    build:
      context: .
      target: caddy
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  data:
